apply plugin: 'com.android.library'
apply plugin: 'de.mobilej.unmock'
apply plugin: 'maven-publish'

group='com.github.talkable'

// Configure JUnit 5 for Android projects
tasks.withType(Test) {
    useJUnitPlatform()
}

android {
    namespace 'com.talkable.sdk'
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 33
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Required for sdk version retrieval to work as of Android Studio 4.1.0: https://issuetracker.google.com/issues/158695880
        buildConfigField 'int', 'VERSION_CODE', "${project.sdk_version_code}"
        buildConfigField 'String', 'VERSION_NAME', "\"${project.sdk_version_name}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                jvmArgs += [
                    '-noverify',
                    // Open ALL critical modules for Mockito static mocking
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/java.time=ALL-UNNAMED',
                    '--add-opens=java.base/java.nio=ALL-UNNAMED',
                    '--add-opens=java.base/java.math=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                    // Needed specifically for ByteBuddy which Mockito uses for mocking
                    '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',

                    // Needed for OkHttp SSL handling
                    '--add-opens=java.base/sun.security.ssl=ALL-UNNAMED',
                    '--add-opens=java.base/javax.net.ssl=ALL-UNNAMED',
                    '--add-opens=java.base/javax.crypto=ALL-UNNAMED'
                ]
                systemProperty 'javax.net.ssl.trustStore', 'NONE'
                // Critical for static mocking in Mockito
                systemProperty 'org.mockito.mockmaker', 'inline'
                systemProperty 'mockito.inline.extended', 'true'
            }
        }
    }
    lint {
        abortOnError false
    }
    buildToolsVersion '36.0.0'

}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // JUnit 5 (Jupiter) dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.12.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.12.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'

    testImplementation 'org.mockito:mockito-core:5.17.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.17.0'

    androidTestImplementation 'androidx.annotation:annotation:1.8.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.facebook.android:facebook-android-sdk:18.0.3'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
